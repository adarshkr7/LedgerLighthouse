name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts: the git-hosted Solidity deps (forge-std, ds-test,
      # safe-smart-account) declare JS build scripts we never use — we consume
      # only their .sol sources via Foundry remappings. Without this, pnpm fails
      # with ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm check:boundary

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts: the git-hosted Solidity deps (forge-std, ds-test,
      # safe-smart-account) declare JS build scripts we never use — we consume
      # only their .sol sources via Foundry remappings. Without this, pnpm fails
      # with ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts
