packages:
  - "contracts"
  - "packages/*"
  - "services/*"
  - "apps/*"
  - "mock-api"
  - "tools/*"

# pnpm writes these keys with a "set this to true or false" placeholder the first
# time it meets a dependency with a build script. Left unanswered, the string is
# not a boolean and *every* plain `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS
# — which also breaks `pnpm dev`, since it auto-installs when the lockfile moves.
#
# All four are false because none of them is needed. `bufferutil` and
# `utf-8-validate` are optional native speedups for `ws`, which falls back to pure
# JS; `keccak` likewise has a JS fallback, and viem hashes with @noble/hashes
# regardless; `protobufjs`'s postinstall only regenerates bundled artifacts. The
# whole project has been built and tested with `--ignore-scripts` throughout,
# which is the evidence that skipping them costs nothing.
allowBuilds:
  bufferutil: false
  keccak: false
  protobufjs: false
  utf-8-validate: false

# The same "should this dependency build?" question, but for the git-hosted
# @safe-global/safe-smart-account, and allowBuilds cannot answer it. pnpm wants to
# run that package's `prepare` (a hardhat + typechain compile) before packing it,
# and its check is `if (!allowBuild(depPath)) throw` — so `false` is not "install
# the raw checkout", it is the error. Only `true` gets past it, and `true` means a
# full nested install plus solc compile of an upstream repo on every fresh clone.
#
# We consume that package purely as Solidity source, through the
# `safe-smart-account/=…/contracts/` line in contracts/remappings.txt; the JS it
# would emit has no consumer here. ignoreScripts short-circuits the prepare check
# entirely and leaves the raw checkout on disk, which is exactly what forge reads.
# It also has to live in config rather than on the command line: `pnpm dev`
# auto-installs when the lockfile moves, and that implicit install takes no flags.
#
# No workspace package defines preinstall/install/postinstall/prepare, so this
# turns nothing else off.
ignoreScripts: true

# @inco/lightning depends on ds-test via git (Foundry's forge-std/ds-test are conventionally
# consumed via git, not npm registry publishes). pnpm's default blockExoticSubdeps flags that as
# a supply-chain risk when it shows up as a *sub*dependency. Both forge-std and ds-test are
# pinned to their canonical upstream orgs in contracts/package.json, so this is a known, narrow
# exception rather than a blanket bypass.
blockExoticSubdeps: false

# Pin to the exact commits @inco/lightning@1.0.2 itself requests (same short SHAs, expanded to
# full 40-char form — pnpm's git resolver cannot resolve a short SHA that isn't an advertised
# ref/tag). This also dedupes our own contracts/package.json dependency against the same commit.
overrides:
  forge-std: "https://github.com/foundry-rs/forge-std#2f05b3001ed9d74b171d17eac80b3765ce186a76"
  ds-test: "https://github.com/dapphub/ds-test#e282159d5170298eb2455a6c05280ab5a73a4ef0"
  "@safe-global/safe-smart-account": "https://github.com/safe-global/safe-smart-account.git#dc437e8fba8b4805d76bcbd1c668c9fd3d1e83be"
