<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Totem — confidential agentic payments">
  <title>Totem — confidential agentic payments</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="55%" stop-color="#101215" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>

    <radialGradient id="floor" cx="26%" cy="74%" r="52%">
      <stop offset="0%" stop-color="rgba(201,162,74,0.17)" />
      <stop offset="60%" stop-color="rgba(201,162,74,0.04)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Turned brass: the light inverts as the surface curves, so the bands
         alternate rather than ramping once. A single ramp reads as plastic. -->
    <linearGradient id="disc" x1="0.04" y1="0.1" x2="0.96" y2="0.9">
      <stop offset="0%" stop-color="#7a5f24" />
      <stop offset="12%" stop-color="#e6cd90" />
      <stop offset="27%" stop-color="#fbf0cd" />
      <stop offset="41%" stop-color="#b08f3c" />
      <stop offset="55%" stop-color="#5f4a1b" />
      <stop offset="69%" stop-color="#a5853a" />
      <stop offset="84%" stop-color="#e3c884" />
      <stop offset="100%" stop-color="#6d5420" />
    </linearGradient>

    <linearGradient id="under" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#43340f" />
      <stop offset="45%" stop-color="#221a08" />
      <stop offset="100%" stop-color="#4d3c14" />
    </linearGradient>

    <linearGradient id="cone" x1="0.15" y1="0" x2="0.92" y2="0.85">
      <stop offset="0%" stop-color="#8e7130" />
      <stop offset="22%" stop-color="#3d2f10" />
      <stop offset="55%" stop-color="#1d1608" />
      <stop offset="80%" stop-color="#2e2410" />
      <stop offset="100%" stop-color="#6b5423" />
    </linearGradient>

    <linearGradient id="spire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a5220" />
      <stop offset="22%" stop-color="#f4e3b0" />
      <stop offset="46%" stop-color="#c2a052" />
      <stop offset="63%" stop-color="#5a4519" />
      <stop offset="86%" stop-color="#d8bc72" />
      <stop offset="100%" stop-color="#4d3b13" />
    </linearGradient>

    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.9)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
    <radialGradient id="cast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.55)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="b2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)" />
  <ellipse cx="330" cy="330" rx="250" ry="80" fill="url(#floor)" />

  <!-- Two shadows. One alone reads as a sticker. -->
  <ellipse cx="352" cy="336" rx="118" ry="18" fill="url(#cast)" filter="url(#b6)" />
  <ellipse cx="330" cy="332" rx="24" ry="6" fill="url(#contact)" filter="url(#b2)" />

  <!-- The rim, smeared by rotation. -->
  <g fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M236 214 A 94 24 0 0 1 424 214" stroke="rgba(240,215,154,0.5)" stroke-width="1.5" />
    <path d="M256 232 A 74 18 0 0 0 404 232" stroke="rgba(201,162,74,0.3)" stroke-width="1.2" />
  </g>

  <!-- Spire, cone, disc. -->
  <path fill="url(#spire)" d="M330 84 C335 122 338 172 339 214 L321 214 C322 172 325 122 330 84 Z" />
  <path fill="url(#cone)" d="M262 226 C277 262 302 290 330 306 C358 290 383 262 398 226 Z" />
  <ellipse cx="330" cy="229" rx="68" ry="13" fill="#120d04" opacity="0.75" />
  <ellipse cx="330" cy="225" rx="74" ry="18" fill="url(#under)" />
  <ellipse cx="330" cy="220" rx="74" ry="18" fill="url(#disc)" />
  <path d="M256 215 A 74 18 0 0 1 404 215" fill="none" stroke="rgba(255,248,224,0.6)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M328 90 C331 124 334 172 335 212" fill="none" stroke="rgba(255,250,232,0.9)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="620" y="186" font-size="76" font-weight="600" letter-spacing="22" fill="#f2f3f4">TOTEM</text>
    <text x="624" y="232" font-size="23" fill="#a5a8ad">Confidential agentic payments</text>
    <text x="624" y="278" font-size="18" fill="#82858b">
      The agent reads the attacker&#8217;s text. It still cannot spend your money.
    </text>
  </g>

  <line x1="624" y1="308" x2="1060" y2="308" stroke="#303338" stroke-width="1" />

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
     font-size="13" fill="#5c6066" letter-spacing="1.9">
    <text x="624" y="340">INCO · x402 · EIP-3009 · BASE SEPOLIA</text>
  </g>
</svg>
