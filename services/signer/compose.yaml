# ROFL container definition for the Authorization Signer.
#
# Two lines here carry the whole upgrade:
#
#   volumes:  mounts rofl-appd's socket in, which is the only way to reach the
#             enclave's key management system.
#   (absent)  there is no payer private key anywhere in this file, because one
#             no longer has to exist outside the TEE.
#
# Before `oasis rofl build`, replace the image with your own published one and
# pin the digest — ROFL requires a publicly reachable OCI registry and a
# `@sha256:` pin so the deployed bytes cannot drift from the audited ones.

services:
  signer:
    # Rebuild and re-pin with, from the repo root:
    #   docker buildx build --platform linux/amd64 --provenance=false \
    #     -f services/signer/Dockerfile -t docker.io/schwarzite/totem-signer:<tag> --push .
    #   docker buildx imagetools inspect docker.io/schwarzite/totem-signer:<tag>
    #
    # v2, built on 9 October 2026 from 16f7ab2: counted enclave key ids, the
    # NETWORK setting and the vault binding in /health. --provenance=false makes
    # this a single linux/amd64 manifest, so there is no attestation entry in an
    # index for a runtime to trip over.
    image: docker.io/schwarzite/totem-signer@sha256:289357cc549e4dca2b312dd8877201b326d37187a482fe07ea0cecfa1df0226d
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8402:8402"
    volumes:
      # The enclave key daemon. Exists only inside ROFL; absent on a laptop,
      # which is why RoflKeyStore fails loudly rather than falling back.
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      # Non-secret address -> key_id index. Persistent so payers survive a
      # restart. Safe to lose: it leaks nothing, and key ids are counted per
      # chain and vault, so a new machine rebuilds it from the chain at boot.
      - /storage/signer:/data
    environment:
      - SIGNER_ROFL_SOCKET=/run/rofl-appd.sock
      - SIGNER_ROFL_INDEX_PATH=/data/payers.json
      - SIGNER_PORT=8402
      # Refuse to boot without an enclave.
      #
      # `openKeyStore` falls back to a file — or, with no key store path set as
      # here, to memory — when the ROFL socket is missing. That fallback exists
      # so the demo runs on a laptop, and it is precisely the assumption this
      # deployment exists to retire. The Dockerfile's `ENV SIGNER_ROFL_SOCKET`
      # means the socket is normally set twice over, but "normally" is doing
      # unpaid work in that sentence: clear it in either place and the container
      # comes up holding payer keys in process memory, logs a warning nobody is
      # reading, and loses every minted key on the next restart.
      #
      # With this set that scenario is a refusal to start, which is the correct
      # failure for anything holding money. It costs nothing when the socket is
      # present — the flag is only consulted once the socket is found missing.
      - SIGNER_REQUIRE_ROFL=true
      # The signer defaults to 127.0.0.1, which is right on a laptop and wrong
      # here: the process would listen only on the container's loopback and the
      # `ports:` mapping above would forward to nothing. The orchestrator gets a
      # connection refused that looks like a networking fault and is a bind.
      - BIND_HOST=0.0.0.0
      # Which is why the token is not optional at this point. Binding wide puts
      # the authorization endpoint on a reachable interface, and the guard only
      # enforces a token when it has one. The orchestrator must be given the same
      # value — SignerClient sends it as a Bearer header.
      #
      # It bounds damage rather than preventing it: the signer authorizes only
      # (goalId, seq) and cannot be argued into signing anything else, so the
      # worst case is a stranger burning a goal's callsRemaining.
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      # Left at their defaults (30 and 240 per minute), listed here because this
      # deployment is the reason they exist.
      #
      # The per-IP limiter in http.ts cannot tell callers apart from in here:
      # requests arrive via the Oasis proxy named by `oasis rofl machine show`,
      # so `remoteAddress` is the proxy's for everyone alike, and the per-IP
      # buckets collapse into one nobody sized on purpose. The limiter in
      # enclave-limit.ts is global by design and sits underneath, bounding calls
      # into rofl-appd over the socket mounted below.
      #
      # Uncomment to change; a non-integer value refuses the boot.
      # - SIGNER_ENCLAVE_MINT_PER_MIN=30
      # - SIGNER_ENCLAVE_DERIVE_PER_MIN=240
      - CHAIN_ID=84532
      # Supplied via `oasis rofl secret set`, not baked into the image.
      - BASE_SEPOLIA_RPC_URL=${BASE_SEPOLIA_RPC_URL}
      - POLICY_VAULT_ADDRESS=${POLICY_VAULT_ADDRESS}
      - USDC_ADDRESS=${USDC_ADDRESS}
