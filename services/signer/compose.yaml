# ROFL container definition for the Authorization Signer.
#
# Two lines here carry the whole upgrade:
#
#   volumes:  mounts rofl-appd's socket in, which is the only way to reach the
#             enclave's key management system.
#   (absent)  there is no payer private key anywhere in this file, because one
#             no longer has to exist outside the TEE.
#
# Before `oasis rofl build`, replace the image with your own published one and
# pin the digest — ROFL requires a publicly reachable OCI registry and a
# `@sha256:` pin so the deployed bytes cannot drift from the audited ones.

services:
  signer:
    # docker buildx build --platform linux/amd64 \
    #   -f services/signer/Dockerfile -t docker.io/YOUR_USER/totem-signer . --push
    image: docker.io/YOUR_USER/totem-signer@sha256:REPLACE_WITH_DIGEST
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8402:8402"
    volumes:
      # The enclave key daemon. Exists only inside ROFL; absent on a laptop,
      # which is why RoflKeyStore fails loudly rather than falling back.
      - /run/rofl-appd.sock:/run/rofl-appd.sock
      # Non-secret address -> key_id index. Persistent so payers survive a
      # restart; safe to lose in the sense that it leaks nothing.
      - /storage/signer:/data
    environment:
      - SIGNER_ROFL_SOCKET=/run/rofl-appd.sock
      - SIGNER_ROFL_INDEX_PATH=/data/payers.json
      - SIGNER_PORT=8402
      - CHAIN_ID=84532
      # Supplied via `oasis rofl secret set`, not baked into the image.
      - BASE_SEPOLIA_RPC_URL=${BASE_SEPOLIA_RPC_URL}
      - POLICY_VAULT_ADDRESS=${POLICY_VAULT_ADDRESS}
      - USDC_ADDRESS=${USDC_ADDRESS}
