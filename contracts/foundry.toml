[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Every block.timestamp comparison in PolicyVault is a deadline: a goal's expiry,
# a hold's payBy, or the end of an EIP-3009 authorization. None is a source of
# randomness, and a few seconds of drift cannot move money the rules forbid:
# reclaimExpired needs `now >= validBefore`, the exact opposite of what USDC
# needs to accept the authorization, and timestamps never go backwards.
# Set here rather than as inline comments so PolicyVault.sol stays byte-identical
# to the deployed source. Comments would change the bytecode's metadata hash.
[lint]
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# No [etherscan] block on purpose. Declaring one makes forge resolve
# ${BASESCAN_API_KEY} eagerly — it then fails commands that need no API key at
# all, and silently overrides `--verifier sourcify`. Pass the key explicitly
# instead:
#   forge verify-contract <addr> src/PolicyVault.sol:PolicyVault \
#     --chain 84532 --etherscan-api-key "$BASESCAN_API_KEY" --watch
